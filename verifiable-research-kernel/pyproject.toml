[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentseal-vrk"
version = "0.1.0"
description = "IntentSeal Verifiable Research Kernel: proof-carrying scientific claim manifests with fail-closed evidence typing and dependency invalidation"
requires-python = ">=3.10"
authors = [{name = "Prince Upadhyay"}]
license = {text = "All rights reserved"}

[project.scripts]
vrk = "intentseal_vrk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
