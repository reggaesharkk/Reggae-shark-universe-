<circle cx="42" cy="32" r="6" fill="#ee957a"/><circle cx="64" cy="32" r="6" fill="#ddc17a"/><circle cx="86" cy="32" r="6" fill="#6ee2bd"/>
<text x="114" y="37" fill="#a2b6c2" font-family="Courier New,monospace" font-size="17" letter-spacing="1">/usr/local/research/ethos.log</text>
<text x="46" y="85" fill="#86edc4" font-family="Courier New,monospace" font-size="24">&gt; The universe does not owe us certainty.</text>
<text x="46" y="121" fill="#e2c493" font-family="Courier New,monospace" font-size="24">&gt; Our claims owe the universe evidence.</text>
<text x="46" y="154" fill="#8d9fb4" font-family="Courier New,monospace" font-size="17">[ research mode: ON ]  [ counterexamples: preserved ]  [ universal claims: bounded ]</text>
