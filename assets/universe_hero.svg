<text x="101" y="287" fill="#bfd2da" font-family="Arial,Helvetica,sans-serif" font-size="21" letter-spacing="2">A MAP OF QUESTIONS, METHODS, RESULTS AND OPEN BOUNDARIES</text>
<text x="101" y="347" fill="#89acb8" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="4">BUILD · ATTACK · FALSIFY · PRESERVE</text>
