<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
<title id="title">Reggae Shark Universe — a map of public research</title>
<desc id="desc">Deep blue research atlas with intersecting orbital curves, fine coordinate lines, teal and copper highlights.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07121f"/><stop offset=".52" stop-color="#0d2434"/><stop offset="1" stop-color="#132d3b"/></linearGradient>
<linearGradient id="arc"><stop stop-color="#71dfce" stop-opacity=".08"/><stop offset=".53" stop-color="#71dfce" stop-opacity=".78"/><stop offset="1" stop-color="#d7a27a" stop-opacity=".9"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#60d9c6" stop-opacity=".22"/><stop offset="1" stop-color="#60d9c6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="400" rx="24" fill="url(#bg)"/>
<circle cx="1320" cy="170" r="280" fill="url(#halo)"/>
