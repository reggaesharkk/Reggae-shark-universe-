<path d="M920 390C1047 340 1042 182 1173 167C1305 153 1325 341 1435 278C1506 237 1512 201 1600 178"/>
<path d="M1048 395C1130 344 1142 287 1217 293C1292 299 1329 359 1400 318C1472 277 1504 281 1598 260"/>
