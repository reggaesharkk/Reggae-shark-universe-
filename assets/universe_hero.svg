<g fill="#d7a27a"><circle cx="1175" cy="217" r="4"><animate attributeName="opacity" values=".55;1;.55" dur="8s" repeatCount="indefinite"/></circle><circle cx="1367" cy="266" r="4"><animate attributeName="opacity" values=".55;1;.55" dur="8s" begin="2s" repeatCount="indefinite"/></circle><circle cx="1435" cy="278" r="4"><animate attributeName="opacity" values=".55;1;.55" dur="8s" begin="4s" repeatCount="indefinite"/></circle></g>
