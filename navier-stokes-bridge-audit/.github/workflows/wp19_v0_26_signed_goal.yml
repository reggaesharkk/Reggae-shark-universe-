name: WP19 v0.26 signed-C500 numerator goal adjoint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wp19_v0_26_signed_goal.yml'
      - 'notes/WP19_v0_26_SIGNED_C500_NUMERATOR_GOAL_ADJOINT.md'
      - 'src/wp19_v0_26_signed_goal_adjoint.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp19_v0_26_signed_goal.yml'
      - 'notes/WP19_v0_26_SIGNED_C500_NUMERATOR_GOAL_ADJOINT.md'
      - 'src/wp19_v0_26_signed_goal_adjoint.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-c500:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5

      - name: Reproduce historical N11 predictor exactly
        run: |
          set -euxo pipefail
          mkdir -p work/c500
          python - <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          import numpy as np
          root=Path('.').resolve()
          sys.path.insert(0,str(root/'src'))
          import wp16_036_sparse_turnover_exact_anchor as exact
          import wp16_036_sparse_turnover_witness as turnover_witness
          from wp16_036_dealiased_trajectory_gate import DealiasedSystem

          witness=root/'results/wp16_n17_holdout/wp16_036_sparse_turnover_112_pairs.json'
          expected_witness='4789e27170f28279b3c6878f8874547b303d5cbd4a20848f3d5d8088bd10a624'
          modes,_,sha=exact.input_state(witness)
          assert sha==expected_witness, sha

          s=DealiasedSystem(turnover_witness.N)
          a=np.asarray([
              [complex(float(v[0]),float(v[1]))
               for v in modes.get(k,(exact.ZERO,)*3)]
              for k in s.modes
          ],dtype=np.complex128)

          nodes=np.lib.format.open_memmap(
              'work/c500/n11_nodes.npy',mode='w+',dtype=np.complex128,
              shape=(121,len(s.modes),3)
          )
          for step in range(121):
              nodes[step]=a
              if step<120:
                  a=s.rk4(a,0.000025)
          nodes.flush()

          node_sha=hashlib.sha256(Path('work/c500/n11_nodes.npy').read_bytes()).hexdigest()
          expected_nodes='b70bf7f7fe85a8c073c02c80e54e1f10d0642f5d030dfe569470c5970ebdda29'
          assert node_sha==expected_nodes,(node_sha,expected_nodes)
          print('N11 predictor SHA PASS',node_sha)
          PY

      - name: Rebuild portable frozen C500
        run: |
          python src/wp19_v0_25_rebuild_c500_portable.py \
            --repo . \
            --n11-nodes work/c500/n11_nodes.npy \
            --k36 results/wp16_n12_holdout/frozen_K36_ordered_source_orbits.json \
            --output work/c500/frozen_C500.json \
            --report work/c500/C500_RECONSTRUCTION_REPORT.json
          cat work/c500/C500_RECONSTRUCTION_REPORT.json

      - name: Upload portable C500
        uses: actions/upload-artifact@v4
        with:
          name: wp19-v0-26-frozen-c500
          path: |
            work/c500/frozen_C500.json
            work/c500/C500_RECONSTRUCTION_REPORT.json
          if-no-files-found: error
          retention-days: 30

  transfer:
    needs: prepare-c500
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        M: [14, 15, 16, 17]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download portable C500
        uses: actions/download-artifact@v4
        with:
          name: wp19-v0-26-frozen-c500
          path: work/c500

      - name: Download certified lower and higher trajectory artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          M=${{ matrix.M }}
          H=$((M+1))
          mkdir -p work/lower work/higher

          case "${M}" in
            14) gh run download 36608785015 --repo '${{ github.repository }}' --name wp19-n14-arb-certificate --dir work/lower ;;
            15|16|17) gh run download 36669057015 --repo '${{ github.repository }}' --name wp19-same-datum-N${M}-arb --dir work/lower ;;
          esac

          case "${H}" in
            15|16|17) gh run download 36669057015 --repo '${{ github.repository }}' --name wp19-same-datum-N${H}-arb --dir work/higher ;;
            18) gh run download 36706229638 --repo '${{ github.repository }}' --name wp19-same-datum-N18-arb-recovered --dir work/higher ;;
          esac

          for d in work/lower work/higher; do
            test -f ${d}/nodes.npy
            test -f ${d}/rhs.npy
            test -f ${d}/metadata.json
            test -f ${d}/000.json
            test -f ${d}/119.json
          done

      - name: Download v0.25b exact endpoint certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          M=${{ matrix.M }}
          H=$((M+1))
          mkdir -p work/lower-cert work/higher-cert
          gh run download 36726449421 --repo '${{ github.repository }}' --name wp19-v0-25b-N${M} --dir work/lower-cert
          gh run download 36726449421 --repo '${{ github.repository }}' --name wp19-v0-25b-N${H} --dir work/higher-cert
          test -f work/lower-cert/N${M}_signed_C500.json
          test -f work/higher-cert/N${H}_signed_C500.json

      - name: Run signed-numerator Hermite goal-adjoint gate
        run: |
          set -euxo pipefail
          M=${{ matrix.M }}
          H=$((M+1))
          mkdir -p results/wp19_v0_26
          python src/wp19_v0_26_signed_goal_adjoint.py \
            --repo . \
            --M ${M} \
            --lower-dir work/lower \
            --higher-dir work/higher \
            --sign-chart results/wp19_bridge/frozen_K36_numerator_sign_chart_N13.json \
            --c500 work/c500/frozen_C500.json \
            --lower-cert work/lower-cert/N${M}_signed_C500.json \
            --higher-cert work/higher-cert/N${H}_signed_C500.json \
            --output results/wp19_v0_26/M${M}_to_M${H}.json

      - name: Record transition hash
        run: |
          sha256sum results/wp19_v0_26/*.json > results/wp19_v0_26/SHA256SUMS.txt

      - name: Upload transition result
        uses: actions/upload-artifact@v4
        with:
          name: wp19-v0-26-M${{ matrix.M }}
          path: results/wp19_v0_26
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: transfer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download transition artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wp19-v0-26-M*
          path: gathered

      - name: Aggregate v0.26 design gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          for M in (14,15,16,17):
              p=Path(f'gathered/wp19-v0-26-M{M}/M{M}_to_M{M+1}.json')
              x=json.loads(p.read_text())
              rows.append({
                  'transition':x['transition'],
                  'base_J':x['endpoint_identity']['base_floating_J'],
                  'target_J':x['endpoint_identity']['target_floating_J'],
                  'actual_delta_J':x['actual_delta_signed_numerator'],
                  'dual_prediction':x['hermite_simpson_dual_prediction'],
                  'total_remainder_actual_minus_dual':x['total_remainder_actual_minus_dual'],
                  'total_remainder_over_base_certified_margin':x['total_remainder_over_base_certified_margin'],
                  'actual_transfer_over_base_certified_margin':x['actual_transfer_over_base_certified_margin'],
                  'positive_actual_transfer_over_base_certified_margin':x['positive_actual_transfer_over_base_certified_margin'],
                  'nonlinear_radius_bound_over_base_certified_margin':x['nonlinear_dynamic_remainder_candidate']['radius_bound_over_base_certified_margin'],
                  'scout_total_budget_over_base_certified_margin':x['margin']['scout_total_budget_over_base_certified_margin'],
                  'objective_gradient_directional_check_relative_error':x['objective_gradient_directional_check_relative_error'],
                  'base_reference_relative_error':x['endpoint_identity']['base_reference_relative_error'],
                  'target_reference_relative_error':x['endpoint_identity']['target_reference_relative_error'],
                  'frozen_signs_match':x['endpoint_identity']['frozen_K36_signs_match_base'] and x['endpoint_identity']['frozen_K36_signs_match_target'],
              })

          max_ref=max(max(r['base_reference_relative_error'],r['target_reference_relative_error']) for r in rows)
          max_grad=max(r['objective_gradient_directional_check_relative_error'] for r in rows)
          max_rem=max(r['total_remainder_over_base_certified_margin'] for r in rows)
          max_budget=max(r['scout_total_budget_over_base_certified_margin'] for r in rows)
          signs=all(r['frozen_signs_match'] for r in rows)
          proceed=(signs and max_ref < 5e-11 and max_grad < 2e-5 and max_rem < 0.02 and max_budget < 0.50)

          summary={
              'schema':'wp19-v0.26-signed-c500-numerator-goal-adjoint-summary-v1',
              'copyright':'Copyright (c) 2026 Prince Upadhyay. All Rights Reserved.',
              'status':'PASS PRE-INTERVAL SIGNED-NUMERATOR DESIGN GATE' if proceed else 'SHARPEN SIGNED-NUMERATOR TRANSFER BEFORE INTERVALIZATION',
              'rows':rows,
              'maximum_endpoint_reference_relative_error':max_ref,
              'maximum_objective_gradient_check_relative_error':max_grad,
              'maximum_total_remainder_over_base_certified_margin':max_rem,
              'maximum_scout_total_budget_over_base_certified_margin':max_budget,
              'all_frozen_K36_endpoint_signs_match':signs,
              'proceed_to_intervalization':proceed,
              'next_target':'interval terminal polynomial gradient + interval backward adjoint + rigorous dual quadrature + rigorous endpoint/nonlinear remainder, normalizer separate',
              'claim_boundary':'Floating pre-interval design gate only; no all-N or continuum theorem.'
          }
          Path('final').mkdir()
          Path('final/WP19_v0_26_SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          for p in Path('gathered').glob('wp19-v0-26-M*/M*_to_M*.json'):
              (Path('final')/p.name).write_bytes(p.read_bytes())
          print(json.dumps(summary,indent=2))
          PY

      - name: Record final hashes
        run: |
          find final -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > final/SHA256SUMS.txt

      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: wp19-v0-26-signed-c500-goal-adjoint
          path: final
          if-no-files-found: error
          retention-days: 30