name: WP19 same-datum Arb N15-N18

# Frozen after the certified N11-N18 chain. Run manually only.
# This avoids accidental six-hour N15-N18 matrix reruns when shared validator
# source is edited for recovery, replay, or later work packages.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        N: [15, 16, 17, 18]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 python-flint

      - name: Run same-datum Arb validation
        run: |
          mkdir -p results/wp19_multin/N${{ matrix.N }}
          python src/wp19_multin_same_datum_arb.py \
            --N ${{ matrix.N }} \
            --output-dir results/wp19_multin/N${{ matrix.N }} \
            --workers 2

      - name: Record hashes
        if: always()
        run: |
          if [ -d results/wp19_multin/N${{ matrix.N }} ]; then
            find results/wp19_multin/N${{ matrix.N }} -maxdepth 1 -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > results/wp19_multin/N${{ matrix.N }}/SHA256SUMS.txt || true
          fi

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp19-same-datum-N${{ matrix.N }}-arb
          path: results/wp19_multin/N${{ matrix.N }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
