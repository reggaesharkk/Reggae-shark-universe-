name: WP19 N18 resume from segment 099

# Completed historical workflow. Manual replay only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  resume-n18:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 python-flint

      - name: Recover preserved N18 partial artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/wp19_multin/N18
          gh run download 36669057015 \
            --repo "${{ github.repository }}" \
            --name wp19-same-datum-N18-arb \
            --dir results/wp19_multin/N18

          python - <<'PY'
          from pathlib import Path
          import json, re
          d=Path("results/wp19_multin/N18")
          segs=sorted(
              int(p.stem) for p in d.glob("*.json")
              if re.fullmatch(r"\d{3}",p.stem)
          )
          assert segs == list(range(99)), (len(segs), segs[:3], segs[-5:])
          assert (d/"nodes.npy").is_file()
          assert (d/"rhs.npy").is_file()
          assert (d/"metadata.json").is_file()
          print("Recovered exactly 99 cached segments: 000..098")
          print("Remaining segments:", list(range(99,120)))
          PY

          cat > results/wp19_multin/N18/RECOVERY_PROVENANCE.json <<'JSON'
          {
            "schema": "wp19-n18-resume-provenance-v1",
            "source_run_id": 36669057015,
            "source_artifact_id": 11090034237,
            "source_artifact_name": "wp19-same-datum-N18-arb",
            "source_artifact_sha256": "7399353fbf30e0c63c425b1c199db5042ea9d43e03131a846f7a1154edacd808",
            "source_job_conclusion": "cancelled at the six-hour GitHub-hosted job limit",
            "recovered_segment_range": "000..098",
            "remaining_segment_range": "099..119",
            "recovery_rule": "verify cached segment input hashes against nodes.npy/rhs.npy before reuse; recompute any invalid cached segment"
          }
          JSON

      - name: Resume N18 Arb validation
        run: |
          python src/wp19_multin_same_datum_arb.py \
            --N 18 \
            --output-dir results/wp19_multin/N18 \
            --workers 4

      - name: Verify final N18 certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/wp19_multin/N18/n18_same_datum_certificate.json")
          x=json.loads(p.read_text())
          assert x["result"]=="PASS"
          assert x["N"]==18
          assert x["endpoint"]["certified_negative_if_E_valid"] is True
          assert x["normalizer_guard"]["all_120_segments_pass"] is True
          print(json.dumps({
              "result":x["result"],
              "N":x["N"],
              "terminal_error":x["symmetric_strain_error_upper_decimal"],
              "FT_interval":[
                  x["endpoint"]["F_true_lower_decimal"],
                  x["endpoint"]["F_true_upper_decimal"]
              ],
              "normalizer_lower":x["normalizer_guard"]["z_abs_uniform_lower_decimal"]
          }, indent=2))
          PY

      - name: Record final hashes
        if: always()
        run: |
          if [ -d results/wp19_multin/N18 ]; then
            find results/wp19_multin/N18 -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > results/wp19_multin/N18/SHA256SUMS.txt || true
          fi

      - name: Upload recovered N18 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp19-same-datum-N18-arb-recovered
          path: results/wp19_multin/N18
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
