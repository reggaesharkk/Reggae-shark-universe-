name: WP19 v0.27c0 Arb adjoint VJP point

on:
  push:
    branches: [wp19-v0.27c-adjoint-validation]
    paths:
      - '.github/workflows/wp19_v0_27c0_arb_vjp_point.yml'
      - 'src/wp19_v0_27c_arb_vjp_point.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-c500:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install numpy==2.3.5
      - name: Reproduce historical N11 predictor exactly
        run: |
          set -euxo pipefail
          mkdir -p work/c500
          python - <<'PY'
          import hashlib,sys
          from pathlib import Path
          import numpy as np
          root=Path('.').resolve()
          sys.path.insert(0,str(root/'src'))
          import wp16_036_sparse_turnover_exact_anchor as exact
          import wp16_036_sparse_turnover_witness as witness_mod
          from wp16_036_dealiased_trajectory_gate import DealiasedSystem
          witness=root/'results/wp16_n17_holdout/wp16_036_sparse_turnover_112_pairs.json'
          modes,_,sha=exact.input_state(witness)
          expw='4789e27170f28279b3c6878f8874547b303d5cbd4a20848f3d5d8088bd10a624'
          assert sha==expw,sha
          s=DealiasedSystem(witness_mod.N)
          a=np.asarray([[complex(float(v[0]),float(v[1])) for v in modes.get(k,(exact.ZERO,)*3)] for k in s.modes],dtype=np.complex128)
          nodes=np.lib.format.open_memmap('work/c500/n11_nodes.npy',mode='w+',dtype=np.complex128,shape=(121,len(s.modes),3))
          for step in range(121):
              nodes[step]=a
              if step<120:
                  a=s.rk4(a,0.000025)
          nodes.flush()
          got=hashlib.sha256(Path('work/c500/n11_nodes.npy').read_bytes()).hexdigest()
          exp='b70bf7f7fe85a8c073c02c80e54e1f10d0642f5d030dfe569470c5970ebdda29'
          assert got==exp,(got,exp)
          PY
      - name: Rebuild portable frozen C500
        run: |
          python src/wp19_v0_25_rebuild_c500_portable.py \
            --repo . \
            --n11-nodes work/c500/n11_nodes.npy \
            --k36 results/wp16_n12_holdout/frozen_K36_ordered_source_orbits.json \
            --output work/c500/frozen_C500.json \
            --report work/c500/C500_RECONSTRUCTION_REPORT.json
      - uses: actions/upload-artifact@v4
        with:
          name: wp19-v0-27c0-frozen-c500
          path: work/c500
          if-no-files-found: error
          retention-days: 30

  vjp:
    needs: prepare-c500
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        M: [14,15,16,17]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validated arithmetic dependencies
        run: |
          python -m pip install numpy==2.3.5 python-flint
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: wp19-v0-27c0-frozen-c500
          path: work/c500
      - name: Download certified lower predictor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          M=${{ matrix.M }}
          mkdir -p work/lower
          case "$M" in
            14) gh run download 36608785015 --repo '${{ github.repository }}' --name wp19-n14-arb-certificate --dir work/lower ;;
            15|16|17) gh run download 36669057015 --repo '${{ github.repository }}' --name wp19-same-datum-N$M-arb --dir work/lower ;;
          esac
          test -f work/lower/nodes.npy
          test -f work/lower/rhs.npy
          test -f work/lower/metadata.json
      - name: Run direct Arb adjoint VJP point cross-check
        run: |
          set -euxo pipefail
          M=${{ matrix.M }}
          mkdir -p results/wp19_v0_27c0
          python src/wp19_v0_27c_arb_vjp_point.py \
            --repo . \
            --M $M \
            --lower-dir work/lower \
            --sign-chart results/wp19_bridge/frozen_K36_numerator_sign_chart_N13.json \
            --c500 work/c500/frozen_C500.json \
            --output results/wp19_v0_27c0/M$M'_arb_vjp_point.json'
      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          M=int('${{ matrix.M }}')
          x=json.loads(Path(f'results/wp19_v0_27c0/M{M}_arb_vjp_point.json').read_text())
          assert x['status']=='PASS ARB ADJOINT-VJP POINT CROSSCHECK',x
          direct=float(x['selected_mode_direct_crosscheck']['arb_vs_explicit_direct_relative_difference_upper_decimal'])
          assert direct<1e-12,x
          print(json.dumps({
              'M':M,
              'arb_vs_explicit_direct_relative_upper':direct,
              'arb_vs_fft_relative_upper':x['arb_vs_fft_relative_difference_upper_decimal'],
              'fft_vs_explicit_direct_relative':x['selected_mode_direct_crosscheck']['fft_vs_explicit_direct_relative_difference'],
          },indent=2))
          PY
      - name: Hash
        run: sha256sum results/wp19_v0_27c0/*.json > results/wp19_v0_27c0/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wp19-v0-27c0-M${{ matrix.M }}
          path: results/wp19_v0_27c0
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: vjp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wp19-v0-27c0-M*
          path: gathered
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for M in (14,15,16,17):
              x=json.loads(Path(f'gathered/wp19-v0-27c0-M{M}/M{M}_arb_vjp_point.json').read_text())
              rows.append({
                  'M':M,
                  'status':x['status'],
                  'arb_vs_explicit_direct_relative_upper':x['selected_mode_direct_crosscheck']['arb_vs_explicit_direct_relative_difference_upper_decimal'],
                  'arb_vs_fft_relative_upper':x['arb_vs_fft_relative_difference_upper_decimal'],
                  'fft_vs_explicit_direct_relative':x['selected_mode_direct_crosscheck']['fft_vs_explicit_direct_relative_difference'],
              })
          passed=all(
              r['status']=='PASS ARB ADJOINT-VJP POINT CROSSCHECK'
              and float(r['arb_vs_explicit_direct_relative_upper'])<1e-12
              for r in rows
          )
          out={
              'schema':'wp19-v0.27c0-arb-adjoint-vjp-point-summary-v1',
              'status':'PASS ARB ADJOINT-VJP POINT CROSSCHECK' if passed else 'FAIL',
              'rows':rows,
              'next_target':'v0.27c1 whole-segment Arb residual enclosure for the backward adjoint using the validated direct VJP kernel.',
              'claim_boundary':'Adjoint nonlinear-operator arithmetic cross-check only; no adjoint trajectory/all-N/continuum theorem.'
          }
          Path('final').mkdir()
          Path('final/WP19_v0_27c0_SUMMARY.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          for p in Path('gathered').glob('wp19-v0-27c0-M*/M*_arb_vjp_point.json'):
              (Path('final')/p.name).write_bytes(p.read_bytes())
          print(json.dumps(out,indent=2))
          if not passed:
              raise SystemExit(1)
          PY
      - name: Hash final
        run: find final -type f -print0 | sort -z | xargs -0 sha256sum > final/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wp19-v0-27c0-arb-adjoint-vjp-point
          path: final
          if-no-files-found: error
          retention-days: 30
